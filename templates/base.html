<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}GreenBEE — Rent a Friend, Anytime{% endblock %}</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#14181A',
          green: { DEFAULT: '#1E8449', dark: '#145A30', light: '#34C069' },
          charcoal: { DEFAULT: '#1C1F1D', light: '#3A403C' },
          cloth: '#F7F8F6'
        },
        fontFamily: {
          display: ['Poppins', 'sans-serif'],
          body: ['Inter', 'sans-serif']
        }
      }
    }
  }
</script>
<style>
  html.lg-locked, html.lg-locked body { overflow: hidden; }
  #location-gate { position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: center;
    justify-content: center; padding: 16px; background: rgba(20,24,26,.92); backdrop-filter: blur(6px); }
  #location-gate[hidden] { display: none; }
  #location-gate .lg-card { background: #fff; color: #14181A; max-width: 400px; width: 100%; border-radius: 18px;
    padding: 28px 24px; text-align: center; font-family: Inter, system-ui, sans-serif; }
  #location-gate h2 { font-family: Poppins, system-ui, sans-serif; font-size: 20px; font-weight: 600; margin: 8px 0; }
  #location-gate p { font-size: 14px; line-height: 1.5; color: rgba(20,24,26,.7); margin: 0; }
  #location-gate #lg-help { margin-top: 12px; font-size: 12.5px; color: #b42318; }
  #location-gate button { margin-top: 20px; width: 100%; border: 0; border-radius: 10px; padding: 12px;
    background: #1E8449; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
  #location-gate button:hover { background: #145A30; }
  #location-gate button:disabled { opacity: .6; cursor: wait; }
</style>
</head>
<body class="bg-cloth text-ink font-body">
<!-- LOCATION GATE: location permission dene tak poori site block rehti hai -->
<div id="location-gate" role="dialog" aria-modal="true" aria-labelledby="lg-title">
  <div class="lg-card">
    <div style="
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      " aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none"
          xmlns="http://www.w3.org/2000/svg">
        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>
        <circle cx="12" cy="10" r="2.5"
                stroke="currentColor"
                stroke-width="2"/>
      </svg>
    </div>
    <h2 id="lg-title">Location access required</h2>
    <p id="lg-msg">Location allow karna zaroori hai.</p>
    <p id="lg-help" hidden></p>
    <button id="lg-btn" type="button">Allow location</button>
  </div>
</div>
<noscript><p style="position:fixed;inset:0;z-index:2147483001;background:#fff;padding:24px;text-align:center">JavaScript aur location access ke bina GreenBEE use nahi ho sakta.</p></noscript>
{% block content %}{% endblock %}
<script>
  const GOOGLE_CLIENT_ID = "{{ google_client_id }}";
</script>
<script src="{{ url_for('static', filename='js/location-gate.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
