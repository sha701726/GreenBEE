{% extends "base.html" %}
{% block title %}Admin — GreenBEE{% endblock %}
{% block content %}
<header class="border-b border-green/10">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-2">
    <span class="font-display font-extrabold text-xl tracking-tight"><span class="text-green">Green</span><span class="text-ink">BEE</span> <span class="text-sm font-medium text-ink/50">Admin</span></span>
    <button id="logout" class="hidden ml-auto text-sm text-ink/50 hover:text-green-dark">Logout</button>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
  <div id="login" class="max-w-xs mx-auto mt-16 bg-white rounded-2xl border border-green/10 p-6">
    <h1 class="font-display font-semibold text-lg mb-3">Admin login</h1>
    <input id="key" type="password" placeholder="Admin key" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm">
    <p id="login-error" class="hidden text-xs text-red-600 mt-2"></p>
    <button id="login-btn" class="mt-3 w-full bg-green hover:bg-green-dark text-white rounded-lg py-2 text-sm font-medium">Login</button>
  </div>

  <div id="panel" class="hidden">
    <div id="stats" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-5"></div>
    <div class="flex gap-1 sm:gap-2 border-b border-green/10 mb-4 text-sm overflow-x-auto no-scrollbar whitespace-nowrap">
      <button data-tab="companions" class="tab-btn px-3 sm:px-4 py-2 font-medium shrink-0">Companions</button>
      <button data-tab="reports" class="tab-btn px-3 sm:px-4 py-2 font-medium shrink-0">Reports / SOS</button>
      <button data-tab="customers" class="tab-btn px-3 sm:px-4 py-2 font-medium shrink-0">Customers</button>
      <button data-tab="bookings" class="tab-btn px-3 sm:px-4 py-2 font-medium shrink-0">Bookings</button>
    </div>
    <p id="msg" class="hidden text-sm mb-3"></p>
    <div id="content"></div>
  </div>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
